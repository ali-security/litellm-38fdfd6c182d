name: Seal Tests

on:
  push:
    branches: [main, master, litellm_internal_staging]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  proxy-route-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.9
      - name: Install dependencies
        run: |
          uv sync --frozen --group ci --group proxy-dev --extra google --extra proxy --extra semantic-router
      - name: Generate Prisma client
        env:
          PRISMA_BINARY_CACHE_DIR: ${{ runner.temp }}/prisma-cache
        run: |
          uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma
      - name: Run proxy route tests
        run: |
          uv run --no-sync pytest tests/proxy_unit_tests/test_proxy_routes.py --tb=short -vv -n 2
