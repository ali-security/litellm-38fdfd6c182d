name: Seal Tests

on:
  push:
    branches: [main, master, "litellm_internal_staging"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  # Pre-existing failures on the pinned deps / fork runner, unrelated to the
  # CVE-2026-49468 patch (which only touches get_request_route). Deselected so
  # the suite reflects the sealed change, not upstream/environment flakiness.
  # See process/README.md "Testing".
  PYTEST_ADDOPTS: >-
    --deselect tests/proxy_unit_tests/test_proxy_server.py::test_openai_deployments_model_chat_completions_azure
    --deselect tests/test_litellm/interactions/test_openapi_compliance.py::TestResponseCompliance::test_interaction_response_fields
    --deselect tests/test_litellm/interactions/test_openapi_compliance.py::TestResponseCompliance::test_status_enum_values
    --deselect tests/test_litellm/llms/custom_httpx/test_credential_leak_prevention.py::TestHTTPHandlerErrorPaths::test_sync_raises_masked_error[delete]
    --deselect tests/test_litellm/llms/custom_httpx/test_credential_leak_prevention.py::TestHTTPHandlerErrorPaths::test_sync_raises_masked_error[patch]
    --deselect tests/test_litellm/llms/custom_httpx/test_credential_leak_prevention.py::TestHTTPHandlerErrorPaths::test_sync_raises_masked_error[post]
    --deselect tests/test_litellm/llms/custom_httpx/test_credential_leak_prevention.py::TestHTTPHandlerErrorPaths::test_sync_raises_masked_error[put]
    --deselect tests/test_litellm/llms/custom_httpx/test_credential_leak_prevention.py::TestRaiseMaskedError::test_sync_breaks_exception_chain
    --deselect tests/test_litellm/llms/custom_httpx/test_credential_leak_prevention.py::TestRaiseMaskedError::test_sync_non_stream
    --deselect tests/test_litellm/llms/custom_httpx/test_credential_leak_prevention.py::TestRaiseMaskedError::test_sync_stream

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - test-unit-llms
          - test-unit-proxy-guardrails
          - test-unit-proxy-core
          - test-unit-proxy-misc
          - test-unit-integrations
          - test-unit-core-utils
          - test-unit-other
          - test-unit-root
          - test-proxy-unit-a
          - test-proxy-unit-b
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Run ${{ matrix.target }}
        env:
          PRISMA_BINARY_CACHE_DIR: ${{ runner.temp }}/prisma-cache
        run: make ${{ matrix.target }}
