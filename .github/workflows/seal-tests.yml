name: Seal Tests

on:
  push:
    branches: [main, master, "litellm_internal_staging"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - test-unit-llms
          - test-unit-proxy-guardrails
          - test-unit-proxy-core
          - test-unit-proxy-misc
          - test-unit-integrations
          - test-unit-core-utils
          - test-unit-other
          - test-unit-root
          - test-proxy-unit-a
          - test-proxy-unit-b
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Run ${{ matrix.target }}
        env:
          PRISMA_BINARY_CACHE_DIR: ${{ runner.temp }}/prisma-cache
        run: make ${{ matrix.target }}
